        <ul style="margin: 0 0 1.5rem; padding-left: 1.25rem;">
          <li><strong>Dungeon Archive</strong> — Una PWA rápida e instalable que pone la referencia de D&amp;D 5e al alcance de la mesa sin depender de una conexión a Internet. <a href="/proyectos/dungeon-archive" style="color: #e8112d;">Ver ficha</a></li>
          <li><strong>Euromario</strong> — Un radar de noticias de videojuegos que filtra el ruido, agrupa las historias duplicadas y usa IA para resumir y priorizar solo lo que importa, publicado como web estática sin infraestructura de pago. <a href="/proyectos/euromario" style="color: #e8112d;">Ver ficha</a></li>
          <li><strong>Cosmere Archive</strong> — Archivo interactivo del Cosmere, el universo literario de Brandon Sanderson, pensado para explorar sus mundos, personajes, historias y sistemas a través de una experiencia visual alejada del formato tradicional de una wiki. <a href="/proyectos/cosmere-archive" style="color: #e8112d;">Ver ficha</a></li>
          <li><strong>Recomendador de Campeones</strong> — Proyecto final del bootcamp de Qualentum: un modelo de machine learning en Python que recomienda campeones de League of Legends, entrenado con datos reales de partidas obtenidos de la API de Riot Games. <a href="/proyectos/recomendador-campeones" style="color: #e8112d;">Ver ficha</a></li>
          <li><strong>Proyecto Gambia</strong> — Aplicación Android nativa en Kotlin para la gestión de salud en Gambia, inspirada en MyGNUHealth e implementada como mi Trabajo de Fin de Grado de DAM, con datos médicos offline y sincronización a un servidor remoto. <a href="/proyectos/proyecto-gambia" style="color: #e8112d;">Ver ficha</a></li>
          <li><strong>Repository Library</strong> — Un hub con la distribución del cliente de escritorio de Steam que reúne varios portfolios temáticos de videojuegos y los abre como si fueran productos de una tienda. <a href="/proyectos/repository-library" style="color: #e8112d;">Ver ficha</a></li>
          <li><strong>Vault Archive</strong> — Un portfolio construido dentro de un Pip-Boy 3000 replicado carcasa por carcasa, con seis módulos que funcionan en lugar de un filtro verde sobre una página web. <a href="/proyectos/vault-archive" style="color: #e8112d;">Ver ficha</a></li>
